name: Deploy Reader to GitHub Pages

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [cgv-data-published]
  workflow_dispatch:
    inputs:
      cgv_data_commit:
        description: "Immutable cgv-data commit (40-character SHA); defaults to the pinned version"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cgv-reader
        uses: actions/checkout@v4

      - name: Resolve immutable cgv-data version
        id: cgv-data-version
        env:
          DISPATCH_COMMIT: ${{ github.event.client_payload.cgv_data_commit }}
          MANUAL_COMMIT: ${{ inputs.cgv_data_commit }}
        run: |
          node -e '
            const fs = require("node:fs");
            const pinned = JSON.parse(fs.readFileSync("config/cgv-data-version.json", "utf8"));
            const commit = process.env.DISPATCH_COMMIT || process.env.MANUAL_COMMIT || pinned.commit;
            if (!/^[0-9a-f]{40}$/i.test(commit)) throw new Error("cgv_data_commit must be a full immutable Git SHA");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `commit=${commit}\n`);
          '

      - name: Checkout cgv-data (Bible / morph / interlinear)
        uses: actions/checkout@v4
        with:
          repository: Cultivados-en-Gracia-y-Verdad/cgv-data
          path: cgv-data
          ref: ${{ steps.cgv-data-version.outputs.commit }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          CGV_DATA_PATH: cgv-data
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/reader/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
